<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Call Console — Computer Warriors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDF0F4;
    --paper-2:#F7F9FB;
    --card:#FFFFFF;
    --ink:#111721;
    --muted:#5A6472;
    --faint:#8B95A3;
    --line:#DFE4EB;
    --line-soft:#EDF0F4;
    --navy:#111C2E;
    --navy-2:#1B2A42;
    --accent:#E08A20;
    --accent-deep:#B4650C;
    --accent-soft:#FDF1DF;
    --accent-line:#F2D8AC;
    --alert:#BE3A31;
    --alert-soft:#FCEDEB;
    --alert-line:#F2CBC6;
    --good:#1E7A55;
    --good-soft:#E4F1EB;
    --r:12px;
    --sh-1:0 1px 2px rgba(17,23,33,.05);
    --sh-2:0 1px 3px rgba(17,23,33,.06), 0 8px 24px -6px rgba(17,23,33,.10);
    --sh-3:0 2px 6px rgba(17,23,33,.07), 0 16px 40px -12px rgba(17,23,33,.18);
    --disp:'Plus Jakarta Sans',system-ui,sans-serif;
    --body:'Plus Jakarta Sans',system-ui,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--body);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;line-height:1.55;font-size:15px}
  button{font-family:inherit;color:inherit}
  :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}

  .shell{display:flex;flex-direction:column;min-height:100%}

  /* ================= header ================= */
  header.topbar{
    background:linear-gradient(180deg,var(--navy-2),var(--navy));
    color:#fff;display:flex;align-items:center;gap:14px;padding:14px 24px;
    position:sticky;top:0;z-index:40;box-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 6px 24px -8px rgba(17,23,33,.5);
  }
  .brand{display:flex;align-items:center;gap:13px;min-width:0}
  .brand-logo{height:38px;width:auto;flex:none;display:block}
  .brand-sep{width:1px;height:26px;background:rgba(255,255,255,.18);flex:none}
  .brand-tool{font-family:var(--disp);font-size:14px;font-weight:600;letter-spacing:.2px;color:#EAF0F8;white-space:nowrap}
  .topbar .spacer{flex:1}
  .topnav{position:fixed;top:12px;right:14px;z-index:60;display:flex;gap:9px}
  .topbar-btn{
    background:#fff;border:1px solid var(--line);color:#26313f;
    padding:8px 15px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;
    box-shadow:0 6px 18px -8px rgba(20,30,50,.35);
    display:inline-flex;align-items:center;gap:7px;transition:background .15s,color .15s;
  }
  .topbar-btn:hover{background:rgba(255,255,255,.14);color:#fff}
  .topbar-btn.primary{
    background:linear-gradient(180deg,#F0A03A,var(--accent));border-color:transparent;color:#241202;font-weight:600;
    box-shadow:0 2px 8px -2px rgba(224,138,32,.6), inset 0 1px 0 rgba(255,255,255,.3);
  }
  .topbar-btn.primary:hover{background:linear-gradient(180deg,#F5A945,#E8912A);color:#241202}

  .work{max-width:1060px;width:100%;margin:0 auto;padding:16px 24px 60px;flex:1}

  /* ================= home ================= */
  .greet-home{margin-bottom:34px}
  .eyebrow{
    font-size:10px;letter-spacing:1.7px;text-transform:uppercase;color:var(--accent-deep);
    font-weight:600;margin-bottom:9px;display:flex;align-items:center;gap:9px;
  }
  .eyebrow::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--accent-line),transparent)}
  .home-head{margin:0 0 18px}
  .home-head h2{font-family:var(--disp);font-size:27px;font-weight:600;margin:0 0 4px;letter-spacing:-.6px}
  .home-head p{margin:0;color:var(--muted);font-size:14px}

  .tiles{display:grid;gap:11px}
  .tile{
    position:relative;overflow:hidden;text-align:left;background:var(--card);
    border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);
    padding:17px 18px;cursor:pointer;display:flex;align-items:center;gap:16px;
    transition:transform .16s cubic-bezier(.2,.7,.3,1),box-shadow .16s,border-color .16s;
  }
  .tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tint);opacity:0;transition:opacity .16s}
  .tile:hover{transform:translateY(-2px);box-shadow:var(--sh-2);border-color:#CFD7E1}
  .tile:hover::before{opacity:1}
  .tile .ic{
    width:44px;height:44px;border-radius:11px;flex:none;display:grid;place-items:center;
    background:var(--tint-soft);color:var(--tint);transition:transform .16s;
  }
  .tile:hover .ic{transform:scale(1.05)}
  .tile .ic svg{width:22px;height:22px}
  .tile .txt{flex:1;min-width:0}
  .tile h3{font-family:var(--disp);font-size:16.5px;font-weight:600;margin:0 0 2px;letter-spacing:-.3px}
  .tile p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.45}
  .tile .arr{color:#C6CEDA;flex:none;transition:color .16s,transform .16s}
  .tile .arr svg{width:18px;height:18px;display:block}
  .tile:hover .arr{color:var(--tint);transform:translateX(3px)}

  /* ================= flow chrome ================= */
  .flowbar{display:flex;align-items:center;gap:13px;margin-bottom:16px;flex-wrap:wrap}
  .back{
    background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 13px;
    font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;display:inline-flex;gap:6px;align-items:center;
    box-shadow:var(--sh-1);transition:all .14s;
  }
  .back:hover{color:var(--ink);border-color:#CFD7E1;transform:translateX(-1px)}
  .back svg{width:15px;height:15px}
  .flowtag{display:inline-flex;align-items:center;gap:9px;font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);font-weight:600}
  .flowtag .dot{width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 3px rgba(0,0,0,.04)}
  .steptrack{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.5px}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-2);overflow:hidden;position:relative}
  .panel::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--flow,var(--accent))}
  .greet-home::before{background:var(--accent)}
  .panel-body{padding:30px 32px 30px}
  .step-title{font-family:var(--disp);font-size:24px;font-weight:600;margin:0 0 4px;letter-spacing:-.6px;line-height:1.25}
  .step-sub{margin:0 0 20px;color:var(--muted);font-size:14px}

  /* ================= say block ================= */
  .say{
    position:relative;background:linear-gradient(165deg,var(--navy-2),var(--navy));
    color:#EEF2F8;border-radius:13px;padding:20px 24px 20px 26px;margin:4px 0 18px;
    font-size:16px;line-height:1.62;box-shadow:var(--sh-2), inset 0 1px 0 rgba(255,255,255,.07);
  }
  .say::after{
    content:"";position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:0 3px 3px 0;
    background:linear-gradient(180deg,var(--accent),transparent);
  }
  .say .lbl{display:block;font-size:9.5px;letter-spacing:1.7px;text-transform:uppercase;color:#8497B2;margin-bottom:11px;font-weight:600}
  .say p{margin:0 0 13px}.say p:last-child{margin-bottom:0}
  .say-price{font-family:var(--mono);font-weight:600;color:#FFC880;background:rgba(255,200,128,.1);padding:1px 6px;border-radius:5px}

  /* ================= internal note ================= */
  .note{
    background:var(--accent-soft);border:1px solid var(--accent-line);border-left:3px solid var(--accent);
    border-radius:9px;padding:12px 15px;margin:0 0 18px;font-size:13.5px;color:#6E4708;line-height:1.6;
  }
  .note .nk{display:block;font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent-deep);font-weight:600;margin-bottom:4px}
  .note.warn{background:var(--alert-soft);border-color:var(--alert-line);border-left-color:var(--alert);color:#7E2A23}
  .note.warn .nk{color:var(--alert)}
  .note b{color:#3A2A0A;font-weight:600}
  .note .near{display:block;color:#8A6A2A;font-size:12.5px;margin-top:2px}

  /* ================= choices ================= */
  .choices{display:grid;gap:10px;margin-top:20px}
  .choice{
    text-align:left;background:var(--paper-2);border:1.5px solid var(--line);border-radius:11px;
    padding:15px 17px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:14px;
    transition:all .15s cubic-bezier(.2,.7,.3,1);
  }
  .choice:hover{background:var(--card);border-color:var(--flow,var(--accent));transform:translateX(3px);box-shadow:var(--sh-1)}
  .choice .lab{font-family:var(--disp);font-size:16px;font-weight:600;letter-spacing:-.3px}
  .choice small{display:block;font-family:var(--body);font-weight:400;color:var(--muted);font-size:12.5px;margin-top:3px;letter-spacing:0}
  .choice .arr{color:#C6CEDA;flex:none;transition:color .15s,transform .15s}
  .choice .arr svg{width:17px;height:17px;display:block}
  .choice:hover .arr{color:var(--flow,var(--accent));transform:translateX(2px)}

  /* ================= accordions ================= */
  .sec-lbl{
    font-size:9.5px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:1.7px;
    margin:30px 0 6px;display:flex;align-items:center;gap:10px;
  }
  .sec-lbl::after{content:"";flex:1;height:1px;background:var(--line)}
  .acc{border:1.5px solid var(--line);border-radius:11px;margin-bottom:9px;overflow:hidden;background:var(--card);transition:border-color .15s,box-shadow .15s}
  .acc:hover{border-color:#CFD7E1}
  .acc.open{border-color:var(--flow,var(--accent));box-shadow:var(--sh-1)}
  .acc-head{width:100%;display:flex;align-items:center;gap:13px;padding:14px 16px;background:var(--paper-2);border:none;cursor:pointer;text-align:left;transition:background .15s}
  .acc-head:hover{background:#F1F4F8}
  .acc.open .acc-head{background:var(--card);border-bottom:1px solid var(--line-soft)}
  .acc-title{font-family:var(--disp);font-size:15.5px;font-weight:600;letter-spacing:-.3px}
  .acc-meta{margin-left:auto;font-size:11.5px;color:var(--faint);text-align:right;max-width:50%}
  .acc-arr{color:#C6CEDA;flex:none;transition:transform .2s,color .15s}
  .acc-arr svg{width:17px;height:17px;display:block}
  .acc.open .acc-arr{transform:rotate(180deg);color:var(--flow,var(--accent))}
  .acc-body{display:none;padding:18px 16px 18px}
  .acc.open .acc-body{display:block}

  /* ================= calculator ================= */
  .calc{
    background:linear-gradient(165deg,var(--navy-2),var(--navy));border-radius:12px;padding:17px 19px;margin-bottom:18px;
    box-shadow:var(--sh-2), inset 0 1px 0 rgba(255,255,255,.07);
  }
  .calc-lbl{font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;color:#8497B2;font-weight:600;margin-bottom:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .feed-tag{font-size:9.5px;letter-spacing:1.2px;font-weight:600;text-transform:uppercase}
  .feed-tag.okfeed{color:#6FBF95}
  .feed-tag.warnfeed{color:#D9A05B}
  .c-model-field{flex:2;min-width:170px}
  .c-field input:read-only{opacity:.55;cursor:not-allowed}
  .calc-inputs{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:15px}
  .c-field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:104px}
  .c-field .cl{font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:#8497B2;font-weight:600}
  .c-field input,.c-field select{
    font-family:var(--mono);font-size:15px;font-weight:500;color:#fff;background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:9px 11px;width:100%;transition:all .15s;
  }
  .c-field select{font-family:var(--body);font-size:14px;font-weight:500}
  .c-field select option{color:var(--ink)}
  .c-field input::placeholder{color:#6B7C93}
  .c-field input:focus,.c-field select:focus{outline:none;border-color:var(--accent);background:rgba(255,255,255,.12);box-shadow:0 0 0 3px rgba(224,138,32,.16)}
  .calc-out{display:flex;flex-wrap:wrap;gap:14px;align-items:stretch;border-top:1px solid rgba(255,255,255,.12);padding-top:15px}
  .price-main{
    flex:1;min-width:170px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:10px 14px;
    font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:#8497B2;font-weight:600;
  }
  .price-main b{display:block;font-family:var(--mono);font-size:26px;font-weight:600;color:#fff;letter-spacing:-1px;margin-top:4px;line-height:1.1}
  .price-main .plus{font-family:var(--body);font-size:11px;letter-spacing:.3px;text-transform:none;color:#8497B2;font-weight:400;margin-left:7px}
  .price-mra{
    flex:1;min-width:150px;background:rgba(224,138,32,.1);border:1px solid rgba(224,138,32,.28);border-radius:9px;padding:10px 14px;
    font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:#C9A374;font-weight:600;
  }
  .price-mra b{display:block;font-family:var(--mono);font-size:20px;font-weight:600;color:#FFC880;margin-top:5px;letter-spacing:-.6px;line-height:1.15}

  .cov{
    font-size:13px;color:var(--muted);background:var(--good-soft);border:1px solid #C9E2D5;border-radius:9px;padding:10px 14px;
    display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;
  }
  .cov .ck{font-size:9.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--good);font-weight:600;flex:none}
  .cov .c-cov,.cov{color:#1F4A38}

  /* ================= closing ================= */
  .closing{margin-top:32px;padding-top:24px;border-top:1px dashed var(--line)}
  .closing-h{font-family:var(--disp);font-size:18px;font-weight:600;margin-bottom:15px;letter-spacing:-.4px;display:flex;align-items:center;gap:9px}
  .closing-h::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .closing-sub{margin:-8px 0 14px;color:var(--muted);font-size:13.5px}
  .signoff{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
  .obj-btns{display:flex;gap:9px;flex-wrap:wrap;margin:2px 0}
  .obj-btns.sub{margin-top:14px}
  .obj-b{
    border:1.5px solid var(--line);background:var(--card);border-radius:9px;padding:9px 16px;
    font-size:13.5px;font-weight:500;cursor:pointer;color:var(--muted);transition:all .14s;box-shadow:var(--sh-1);
  }
  .obj-b:hover{border-color:var(--accent);color:var(--ink);transform:translateY(-1px)}
  .obj-b.on{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:var(--sh-2)}
  .reveal{display:none;margin-top:16px}
  .reveal.show{display:block;animation:fade .22s ease}
  @keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .mini-note{
    font-size:12.5px;color:#6E4708;background:var(--accent-soft);border:1px solid var(--accent-line);
    border-radius:8px;padding:9px 13px;margin-top:-6px;
  }
  .mini-note b{color:#3A2A0A;font-weight:600;font-family:var(--mono);font-size:12px}

  /* ================= checklist ================= */
  .checklist-lbl{
    font-size:9.5px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:1.7px;
    margin:32px 0 10px;display:flex;align-items:center;gap:10px;
  }
  .checklist-lbl::after{content:"";flex:1;height:1px;background:var(--line)}
  .actions-list{display:grid;gap:8px}
  .act{
    width:100%;display:flex;align-items:flex-start;gap:12px;border:1.5px solid var(--line);border-radius:10px;
    padding:12px 14px;cursor:pointer;background:var(--paper-2);transition:all .14s;font-size:14px;text-align:left;color:var(--ink);
  }
  .act:hover{border-color:#CFD7E1;background:var(--card)}
  .act .box{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--faint);flex:none;display:grid;place-items:center;margin-top:2px;transition:all .14s}
  .act.on{background:var(--good-soft);border-color:#C9E2D5;color:var(--muted)}
  .act.on .box{background:var(--good);border-color:var(--good)}
  .act.on .box svg{opacity:1}
  .act .box svg{width:11px;height:11px;opacity:0;color:#fff}
  .act.on .lbl-txt{text-decoration:line-through;text-decoration-color:#A9C4B6}

  /* ================= footer ================= */
  .footer-nav{display:flex;gap:11px;align-items:center;padding:18px 32px;border-top:1px solid var(--line);background:var(--paper-2)}
  .btn-primary{
    background:linear-gradient(180deg,#F0A03A,var(--accent));color:#241202;border:none;border-radius:10px;
    padding:12px 24px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:9px;
    box-shadow:0 2px 10px -2px rgba(224,138,32,.55), inset 0 1px 0 rgba(255,255,255,.32);transition:transform .14s,box-shadow .14s;
  }
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 14px -2px rgba(224,138,32,.6), inset 0 1px 0 rgba(255,255,255,.32)}
  .btn-primary svg{width:15px;height:15px}
  .btn-ghost{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:11px 20px;font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer;transition:all .14s}
  .btn-ghost:hover{color:var(--ink);border-color:#CFD7E1}
  .footer-nav .push{margin-left:auto}
  .hint{font-size:12px;color:var(--faint)}

  /* ================= embedded form ================= */
  .embed{margin:2px 0 20px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);box-shadow:var(--sh-1)}
  .embed-lbl{font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--faint);font-weight:600;padding:12px 16px;border-bottom:1px solid var(--line-soft);background:var(--paper-2)}
  .embed iframe{display:block}
  .embed-open{display:block;text-align:center;font-size:12.5px;font-weight:600;color:var(--accent-deep);text-decoration:none;padding:11px;border-top:1px solid var(--line-soft);background:var(--paper-2)}
  .embed-open:hover{background:var(--accent-soft)}

  /* ============ secure payment (SOHO new customer card on file) ============ */
  .pay-card{border:1.5px solid var(--line);border-radius:12px;background:var(--card);box-shadow:var(--sh-1);padding:20px 22px;margin:2px 0 18px}
  .pay-card.ok{border-color:#C9E2D5;background:linear-gradient(180deg,#FFFFFF,#FAFDFB)}
  .pay-eyebrow{font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--accent-deep);font-weight:600;margin-bottom:9px;display:flex;align-items:center;gap:9px}
  .pay-eyebrow::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--accent-line),transparent)}
  .pay-card.ok .pay-eyebrow{color:var(--good)}
  .pay-card.ok .pay-eyebrow::after{background:linear-gradient(90deg,#C9E2D5,transparent)}
  .pay-title{font-family:var(--disp);font-size:19px;font-weight:600;letter-spacing:-.4px;margin:0 0 4px;display:flex;align-items:center;gap:9px}
  .pay-title .tick{width:24px;height:24px;border-radius:50%;background:var(--good-soft);color:var(--good);flex:none;display:grid;place-items:center}
  .pay-title .tick svg{width:14px;height:14px}
  .pay-sub{color:var(--muted);font-size:13.5px;line-height:1.6;margin:0 0 14px}
  .pay-badge{display:inline-flex;align-items:center;gap:8px;background:var(--good-soft);border:1px solid #C9E2D5;color:#1F4A38;border-radius:9px;padding:8px 14px;font-size:14px;font-weight:600;font-family:var(--mono);margin:0 0 14px}
  .pay-actions{display:flex;gap:10px;margin-top:4px;flex-wrap:wrap;align-items:center}
  .pay-msg{font-size:13px;color:var(--alert);background:var(--alert-soft);border:1px solid var(--alert-line);border-radius:8px;padding:9px 13px;margin:0 0 14px}
  .pay-msg.soft{color:#6E4708;background:var(--accent-soft);border-color:var(--accent-line)}
  .pay-frame{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;box-shadow:var(--sh-1);margin:0 0 12px}
  .pay-frame iframe{display:block;border:0;width:100%;min-height:420px}

/* =========================================================================
   ADMIN CONFIG — script overrides, loaded from /api/config (n8n-backed).
   Techs never see this; the shop owner opens it at #admin with a PIN and
   edits the scripts. Overrides are looked up by key with ov('group.key');
   if there's no override the code's built-in default text is used.
   ========================================================================= */
let ADMIN_CFG = {};
const DEF = {};   // built-in default text, captured as t() is called (used by the admin panel)
function deepGet(obj, path){
  return String(path).split('.').reduce((o,k)=> (o && o[k]!==undefined ? o[k] : undefined), obj);
}
function deepSet(obj, path, val){
  const keys = String(path).split('.'); let o = obj;
  for(let i=0;i<keys.length-1;i++){ if(typeof o[keys[i]]!=='object'||o[keys[i]]===null) o[keys[i]]={}; o=o[keys[i]]; }
  o[keys[keys.length-1]] = val;
}
function ov(path){ const v = deepGet(ADMIN_CFG, path); return (v===undefined || v===null || v==='') ? null : v; }
// t(path, fallback): override if present, else the built-in default text.
function t(path, fallback){
  if(fallback!==undefined && DEF[path]===undefined) DEF[path]=fallback;
  const o = ov(path);
  return o!=null ? o : (fallback!==undefined ? fallback : (DEF[path]||''));
}

async function loadAdminConfig(){
  try{
    const r = await fetch('/api/config', { headers:{ 'Accept':'application/json' }, cache:'no-store' });
    const d = await r.json();
    if(d && d.config && typeof d.config==='object') ADMIN_CFG = d.config;
  }catch(e){ /* keep defaults */ }
}

/* ---- fit the two columns to the viewport; Objections sit below the fold ---- */
function fitToViewport(){
  stage.querySelectorAll('.pane').forEach(p=>{ p.style.maxHeight=''; p.style.overflowY=''; p.style.position=''; });
  const split=stage.querySelector('.split');
  if(!split || split.classList.contains('solo')) return;
  if(!window.matchMedia('(min-width:880px)').matches) return;   // stacked on narrow screens
  const top=split.getBoundingClientRect().top;
  const avail=Math.max(200, Math.floor(window.innerHeight - top - 16));
  split.querySelectorAll('.pane').forEach(p=>{ p.style.maxHeight=avail+'px'; p.style.overflowY='auto'; p.style.position='static'; });
}
let _fitRAF;
function scheduleFit(){ cancelAnimationFrame(_fitRAF); _fitRAF=requestAnimationFrame(fitToViewport); }

const ic=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=x=>`$${Number(x).toFixed(2)}`;
const round2=x=>Math.round(x*100)/100;
const R495 =x=>round2(Math.ceil((x+0.05)/5)*5-0.05);
const ceil10=x=>round2(Math.ceil((x+0.05)/10)*10-0.05);

/* ---- live pricing feed (reads the cw-pricing-data shape) ---- */
let PRICING={cats:{},updated:null,ok:false,loading:true,error:null};
async function loadPricing(){
  try{
    const parts=await Promise.all(PRICING_URLS.map(u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})));
    const cats={}; let updated=null;
    for(const d of parts){
      if(d&&d._generated) updated=String(d._generated).slice(0,10);
      for(const k of Object.keys(d||{})){ if(k[0]==='_') continue; if(d[k]&&d[k].models) cats[k]=d[k]; }
    }
    if(!Object.keys(cats).length) throw new Error('no categories');
    PRICING={cats,updated,ok:true,loading:false,error:null};
  }catch(e){ PRICING={cats:{},updated:null,ok:false,loading:false,error:e.message}; }
}
function poolCat(pool){ return PRICING.cats[String(pool||'').toLowerCase()]||null; }
function modelsForPool(pool){ const c=poolCat(pool); return c?Object.keys(c.models):[]; }
function modelRepairs(pool,model){ const c=poolCat(pool); const m=c&&c.models&&c.models[model]; return m?Object.keys(m):[]; }
function modelPrice(pool,model,repair){ const c=poolCat(pool); const m=c&&c.models&&c.models[model]; const r=m&&m[repair]; return r?{price:Number(r.price),warranty:r.warranty||''}:null; }
function classifyRepair(label){
  const s=String(label).toLowerCase();
  if(/batter/.test(s)) return 'battery';
  if(/charg/.test(s)) return 'charging';
  if(/back glass|housing|back cover/.test(s)) return 'backglass';
  if(/hdmi/.test(s)) return 'hdmi';
  if(/clean/.test(s)) return 'cleaning';
  if(/screen|display/.test(s)) return 'screen';
  return 'other';
}

function priceCalc(device,category,costIn,laborIn){
  if(!device||!category||laborIn===''||laborIn==null) return null;
  const cleaning=category==='Cleaning / Overheating';
  if(costIn===''&&!cleaning) return null;
  const Cost=costIn===''?0:Number(costIn), Labor=Number(laborIn);
  if(isNaN(Cost)||isNaN(Labor)) return null;
  const ScreenRaw=Cost<100?Cost*1.45:Cost<200?Cost*1.35:Cost<300?Cost*1.28:Cost*1.25;
  const ScreenPart=ScreenRaw<32.5?29.95:ScreenRaw<36.5?34.95:R495(ScreenRaw);
  const BatteryPart     =Math.max(29.95,ceil10(Cost<15?Cost*2.15:Cost<25?Cost*2:Cost<40?Cost*1.8:Cost<100?Cost*1.6:Cost*1.45));
  const ChargingPortPart=Math.max(39.95,ceil10(Cost<15?Cost*2.75:Cost<30?Cost*2.35:Cost<60?Cost*2:Cost<100?Cost*1.65:Cost*1.5));
  const HousingPart     =Math.max(49.95,ceil10(Cost<50?Cost*1.85:Cost<100?Cost*1.65:Cost<200?Cost*1.45:Cost<300?Cost*1.3:Cost*1.2));
  const SmallPart       =Math.max(29.95,ceil10(Cost<10?Cost*3:Cost<25?Cost*2.5:Cost<50?Cost*2:Cost<100?Cost*1.6:Cost*1.45));
  const ConsolePart     =Math.max(39.95,ceil10(Cost<25?Cost*2.5:Cost<75?Cost*2:Cost<150?Cost*1.5:Cost*1.3));
  let part;
  if(device==='Console'){ part=cleaning?0:ConsolePart; }
  else{ part=({'Screen':ScreenPart,'Battery':BatteryPart,'Charging Port':ChargingPortPart,'Back Glass / Housing':HousingPart,'Other Small Parts':SmallPart})[category]??0; }
  const Repair=part+Labor, t=Repair*1.07;
  const shield=t<100?15.25:t<150?22.87:t<200?30.5:t<250?38.12:t<300?45.75:t<350?53.37:t<400?61:t<450?68.61:t<500?76.23:t<550?83.86:t<600?91.48:99.11;
  const screenNC=category==='Screen'&&device!=='Console';
  const customer=screenNC?R495(Repair+shield):ceil10(Repair);
  let mra=null;
  if(screenNC&&costIn!==''){ const sp=round2(Math.round(ScreenRaw/10)*10-0.05); mra=round2(Math.round((sp+Labor)/10)*10-0.05); }
  return {customer,mra};
}
function coverageFor(device,cat){
  if(cat==='Screen') return t('cov.screen',COV.screen);
  if(cat==='Battery') return t('cov.battery',COV.battery);
  if(cat==='Cleaning / Overheating') return t('cov.cleaning',COV.cleaning);
  if(device==='Console') return t('cov.consoleHw',COV.consoleHw);
  return t('cov.lifetime',COV.lifetime);
}

function turnLine(b){

  if(b.family==="console") return "Consoles are worked out of a queue, so turnaround is usually around 2 to 3 days.";

    : "Depending on the model we may have the part in stock or need to order it; once it's in, most repairs take about 30 to 45 minutes.";

function turnMeta(b, model, cls){
  const t=deviceTier(b, model, cls);
  if(t==="3a"||t==="3b") return "2-3 day queue";
  if(cls==="backglass"||cls==="charging") return "Next day \u00b7 $50 deposit to order";
  if(t==="1") return "Same day \u00b7 ~30-45 min in stock";
  return cls==="battery" ? "A couple days \u00b7 $50 deposit to order" : "Next day \u00b7 $50 deposit to order";
}

function partWord(cls){ return cls==="screen"?"screen":cls==="battery"?"battery":"part"; }

function deviceTier(b, model, cls){
  if(b.family==="console") return "3b";
  if(b.family==="tablet")  return "3a";
  if(b.id==="apple") return "1";
  if(b.id==="samsung" && cls==="screen" && /ultra/i.test(String(model||""))) return "1";
  return "2";
}

function benefitLine(cls, noun){
  if(cls==="screen")    return t('benefit.screen', "That screen repair comes with a lifetime warranty against part defects, plus one free screen replacement within the first 12 months \u2014 so if it breaks again during that first year, you're not paying for another screen.");
  if(cls==="battery")   return t('benefit.battery', "That battery replacement comes with a one-year warranty against part defects.");
  if(cls==="charging")  return t('benefit.charging', "That charging port repair comes with a lifetime warranty against part defects.");
  if(cls==="backglass") return t('benefit.backglass', "That back glass repair comes with a lifetime warranty against part defects.");
  if(cls==="hdmi")      return t('benefit.hdmi', "That HDMI repair comes with a one-year warranty against part defects.");
  if(cls==="cleaning")  return t('benefit.cleaning', "Since we're only cleaning and servicing \u2014 not installing a part \u2014 there's no replacement-part warranty.");
  return t('benefit.other', "That repair comes with a lifetime warranty against part defects.");
}

/* Device-specific closing ask. `family` is phone/tablet/console; `other` = the
   Other Device / manual calculator (device family known, stock status unknown). */
function closingAsk(tier, cls, family, other){
  if(family==="console") return t('ask.console', "Would you like to bring the console in today, or schedule a time to drop it off?");
  if(family==="tablet")  return t('ask.tablet', "Would you like to bring it in today, or schedule a time to drop it off?");
  if(other)              return t('ask.phoneOther', "Would you like to bring it in today, or schedule a time to come in?");
  const inStock = tier==="1" && (cls==="screen"||cls==="battery"||cls==="other");
  return inStock
    ? t('ask.phoneInStock', "Would you like to bring it in today, or schedule a time to have the repair completed?")
    : t('ask.phoneOrder', "Would you like to stop by today so we can confirm the exact model and get the part ordered, or schedule a time to come in?");
}

function tierScript(tier, cls, noun, family, other){
  let benefit;
  if(tier==="3b"){
    benefit = cls==="cleaning" ? benefitLine("cleaning",noun)
            : cls==="screen"   ? benefitLine("screen","console")
            : t('benefit.console', "That console repair comes with a lifetime warranty against part defects.");
  } else {
    benefit = benefitLine(cls, noun);
  }
  const Noun = noun.charAt(0).toUpperCase()+noun.slice(1), Nouns = noun==="iPad"?"iPads":Noun+"s";
  let turn;
  if(cls==="backglass") turn = t('turn.backglass', "Back glass isn't something we keep in stock, so we'll order it in \u2014 it ships overnight, so we'd have it done the next day. There's a fifty-dollar deposit to order the part, and that goes toward the repair.");
  else if(cls==="charging" && (tier==="1"||tier==="2")) turn = t('turn.charging', "Charging ports aren't something we keep in stock, so we'll order the port in \u2014 it ships overnight, so we'd have it done the next day. There's a fifty-dollar deposit to order the part, and that goes toward the repair.");
  else if(tier==="1")  turn = cls==="screen"
                           ? t('turn.instockScreen', "We keep those screens in stock, so we'll have it done in about 30 to 45 minutes.")
                           : cls==="battery"
                           ? t('turn.instockBattery', "We keep those batteries in stock, so we'll have it done in about 30 to 45 minutes.")
                           : t('turn.instockOther', "If we've got the part in stock, we'll have it done in about 30 to 45 minutes.");
  else if(tier==="2")  turn = cls==="battery"
                           ? t('turn.tier2Battery', "Since it's a {noun}, we'll check it in to confirm the exact model and order the battery \u2014 we can't overnight batteries, so it's usually a couple of business days. There's a fifty-dollar deposit to order the part, and that goes toward the repair.")
                           : t('turn.tier2Other', "Since it's a {noun}, we'll check it in to confirm the exact model and order the {part} \u2014 it comes in overnight, so we'd have it done the next day. There's a fifty-dollar deposit to order the part, and that goes toward the repair.");
  else if(tier==="3a") turn = t('turn.queueTablet', "{Nouns} go into our repair queue, and we work on devices in the order they come in \u2014 so you're looking at about two to three business days.");
  else                 turn = t('turn.queueConsole', "Consoles go into our repair queue, and we work on devices in the order they come in \u2014 so you're looking at about two to three business days.");
  turn = turn.replace(/\{noun\}/g, noun).replace(/\{part\}/g, partWord(cls)).replace(/\{Nouns\}/g, Nouns).replace(/\{Noun\}/g, Noun);
  return `${benefit} ${turn} ${t('priceLine',"It's only {price} plus tax.")}\n\n${closingAsk(tier,cls,family,other)}`;
}

function sayAfterFor(cls,noun,turn,label,warranty){
  if(cls==="screen")   return `For that ${noun} screen repair, the price is {price} plus tax.\n\n${turn}\n\nThat screen repair comes with a lifetime warranty against part-defect issues, and it also includes one free screen re-repair within 12 months \u2014 so if the screen breaks again during that first year, you don't pay for another screen repair.`;
  if(cls==="battery")  return `For that ${noun} battery replacement, the price is {price} plus tax.\n\n${turn}\n\nBattery repairs come with a 1-year warranty against part-defect issues.`;
  if(cls==="charging") return `For that ${noun} charging port repair, the price is {price} plus tax.\n\n${turn}\n\nThat repair comes with a lifetime warranty against part-defect issues \u2014 that covers the replacement part itself, not new physical damage, liquid damage, or misuse.`;
  if(cls==="backglass")return `For that ${noun} back glass repair, the price is {price} plus tax.\n\n${turn}\n\nThat repair comes with a lifetime warranty against part-defect issues \u2014 that covers the replacement part itself, not new physical damage, liquid damage, or misuse.`;
  if(cls==="hdmi")     return `For that HDMI repair, the price is {price} plus tax.\n\n${turn}\n\nIf we replace the HDMI port, that repair comes with a 1-year warranty against part-defect issues \u2014 that doesn't cover physical damage, liquid damage, or misuse.`;
  if(cls==="cleaning") return `For that full cleaning and maintenance service, the price is {price} plus tax.\n\n${turn}\n\nSince we're only cleaning and servicing \u2014 not installing a part \u2014 there's no replacement-part warranty. If we find something needs replacing, we'll explain the option and warranty before moving forward.`;
  const w=String(warranty||"").toLowerCase();
  const art=/lifetime/.test(w)?"a lifetime":/1[\s-]?year/.test(w)?"a 1-year":"a part-defect";
  return `For that ${String(label).toLowerCase()} on your ${noun}, the price is {price} plus tax.\n\n${turn}\n\nThat repair comes with ${art} warranty against part-defect issues.`;
}
function coverageTextFor(cls,warranty){
  if(cls==="screen")   return COV.screen;
  if(cls==="battery")  return COV.battery;
  if(cls==="charging"||cls==="backglass") return COV.lifetime;
  if(cls==="hdmi")     return COV.consoleHw;
  if(cls==="cleaning") return COV.cleaning;
  return warranty||COV.lifetime;
}
function calcCategoryFor(cls){
  return {screen:"Screen",battery:"Battery",charging:"Charging Port",backglass:"Back Glass / Housing",hdmi:"HDMI / Display",cleaning:"Cleaning / Overheating"}[cls]||"Other Small Parts";
}

/* ---- navigation ---- */
let drStack=[];
function startDevice(){ state={mode:"device",actions:new Set()}; drStack=[]; renderDevice({stage:"brand"}); }
function drGo(next){ drStack.push(state.dr); renderDevice(next); }
function drBack(){ if(drStack.length){ renderDevice(drStack.pop()); } else goHome(); }
function drChrome(accent,crumb,total,idx){
  return `<div class="flowbar"><button class="back" id="drBack">${ic('<path d="M15 18l-6-6 6-6"/>')} Back</button>`
    + `<span class="flowtag"><span class="dot" style="background:${accent}"></span>${esc(crumb)}</span>`
    + (total?`<span class="steptrack">Step ${idx} / ${total}</span>`:'') + `</div>`;
}
function renderDevice(dr){
  state.dr=dr;
  if(dr.stage==="brand")  return renderBrand();
  if(dr.stage==="model")  return renderModel();
  if(dr.stage==="repair") return renderRepair();
  if(dr.stage==="result") return renderResult();
}

function wireClosing(){
  stage.querySelectorAll('[data-r]').forEach(bn=>bn.onclick=()=>{
    stage.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('on',x===bn));
    stage.querySelectorAll('[data-rev]').forEach(r=>r.classList.toggle('show',r.dataset.rev===bn.dataset.r));
  });
  stage.querySelectorAll('[data-o]').forEach(bn=>bn.onclick=()=>{
    const was=bn.classList.contains('on');
    stage.querySelectorAll('[data-o]').forEach(x=>x.classList.remove('on'));
    stage.querySelectorAll('[data-orev]').forEach(r=>r.classList.remove('show'));
    if(!was){ bn.classList.add('on'); const t=stage.querySelector(`[data-orev="${bn.dataset.o}"]`); if(t) t.classList.add('show'); }
  });
}
function wireChecklist(){
  stage.querySelectorAll('.act').forEach(bn=>bn.onclick=()=>{
    const a=bn.dataset.act;
    if(state.actions.has(a)) state.actions.delete(a); else state.actions.add(a);
    bn.classList.toggle('on');
  });
}


function screen(o){
  const left=o.left||'', right=o.right||'';
  const split = left
    ? `<div class="split"><div class="pane pane-script">${left}</div><div class="pane pane-choices">${right}</div></div>`
    : `<div class="split solo"><div class="pane pane-choices">${right}</div></div>`;
  let h=(o.flowbar||'');
  h+=`<div class="panel${o.home?' greet-home':''}" style="--flow:${o.accent||'var(--accent)'};--flow-soft:${o.accentSoft||'#EEF0F4'}">`;
  h+=`<div class="panel-head">`;
  if(o.eyebrow) h+=`<div class="eyebrow">${esc(o.eyebrow)}</div>`;
  if(o.title) h+=`<h2 class="step-title">${o.title}</h2>`;
  if(o.sub) h+=`<div class="step-sub">${o.sub}</div>`;
  h+=`</div>`+split;
  if(o.full) h+=`<div class="fullrow">${o.full}</div>`;
  if(o.footer) h+=`<div class="footer-nav">${o.footer}</div>`;
  h+=`</div>`;
  return h;
}

/* =========================================================================
   APPOINTMENTS — in-store scheduling (Acuity embed)
   Fixed-height iframe, same convention as the Cognito / SOHO forms
   (auto-resize embed.js intentionally omitted — an injected <script>
   tag doesn't execute via innerHTML anyway, and the iframe stands alone).

   The Info page opens the general scheduler (all categories). Each closing
   screen opens the matching category and pre-fills the intake form with the
   details already on screen (brand, model, repair, quoted price).
   ========================================================================= */
const ACUITY_BASE = "https://app.acuityscheduling.com/schedule.php?owner=39782661";

// Category / type deep-links (exactly as provided by Acuity)
const APPT_LINKS = {
  general:  ACUITY_BASE + "&ref=embedded_csp",
  computer: ACUITY_BASE + "&appointmentType=category:Computer%20Repair%20Drop-Off%20%E2%80%94%20Laptop%2C%20Desktop%20%26%20Mac",
  queue:    ACUITY_BASE + "&appointmentType=category:iPad%20%26%20Game%20Console%20Drop-Off%20%E2%80%94%20Repair%20Queue",
  phone:    ACUITY_BASE + "&appointmentType=95474814"
};

/* Acuity intake-form field IDs for pre-fill. Acuity pre-fills a custom
   question with  &field:<ID>=<value>  — the <ID> is the numeric field id
   from your intake form. FILL THESE IN and pre-fill turns on automatically;
   leave one blank and that field is simply skipped. If the phone form and the
   iPad/console form use DIFFERENT questions, we can split these per category. */
// Acuity form "Repair Booking Details" (id 3321222) — shared by the Phone and
// iPad/Console appointment types, so one set of IDs covers both.
const ACUITY_FIELDS = { brand:18807792, model:18807793, repair:18807794, price:18807795 };

function apptUrl(base, prefill){
  let url=base;
  if(prefill){
    for(const key of Object.keys(ACUITY_FIELDS)){
      const id=ACUITY_FIELDS[key], val=prefill[key];
      if(id && val!=null && val!=="") url += "&field:"+id+"="+encodeURIComponent(val);
    }
  }
  return url;
}
// Read the price currently shown in the script (skips the "$xxx.xx" placeholder)
function currentApptPrice(){
  const sp=stage.querySelector('.say-price');
  const t=sp?sp.textContent.trim():'';
  return /\$\s*\d/.test(t) ? t.replace(/\s+/g,'') : '';
}

// `back` re-renders whatever screen we came from, so a tech mid-call returns to
// the exact result/step. `url` is the category link (defaults to general).
function renderAppointments(back, url){
  const ret = typeof back==="function" ? back : renderInfo;
  const src = url || APPT_LINKS.general;
  stage.innerHTML=`
    <div class="flowbar"><button class="back" id="apptBack">${ic('<path d="M15 18l-6-6 6-6"/>')} Back</button><span class="flowtag"><span class="dot" style="background:var(--accent)"></span>Appointments</span></div>
    <div class="panel" style="--flow:var(--accent)"><div class="panel-body">
      <div class="eyebrow">In-store appointment</div>
      <h2 class="step-title">Schedule a time to come in</h2>
      <p class="step-sub">Pick a slot below. Walk-ins are always welcome too — this just holds a set time.</p>
      ${embedBlock({ label:"In-store appointment scheduling", src, height:800, allow:"payment" })}
    </div></div>`;

}

// Small "Schedule an appointment" button placed at the bottom of the left
// script pane (just above the Objections section) on every closing screen.
/* =========================================================================
   PARTS LOOKUP — Other Device only. The tech types the part (e.g. "iPhone 12
   screen"); the app asks its own /api/parts endpoint, which queries the
   MobileSentrix REST API and returns matches. Tapping a result drops the price
   into "Part cost" (quote fills in) AND auto-sets the device type + repair
   category, and captures the brand + model for the appointment booking details.
   The store buttons are a manual fallback — they open the supplier's pre-filled
   search docked beside the console (suppliers block being embedded, so we open,
   not iframe). PhoneLCDParts stays a link until its API is ready.
   ========================================================================= */
const PARTS_SUPPLIERS = [
  { name:"MobileSentrix",  base:"https://www.mobilesentrix.com" },
  { name:"PhoneLCDParts",  base:"https://www.phonelcdparts.com" }
];
// Set when a part is picked, so the appointment prefill (and booking details)
// can carry the device brand + model inferred from the part name.
let _odPart = { brand:"", model:"" };
// Infer device type, repair category, brand and model from a part title.
function partInfo(name){
  const s = String(name), t = s.toLowerCase();
  let device = "Phone";
  if(/\bipad\b|galaxy tab|\btab\b|tablet|surface/.test(t)) device="Tablet";
  else if(/ps5|ps4|ps3|playstation|xbox|nintendo|\bswitch\b|console|joy-?con|controller|joystick|steam deck/.test(t)) device="Console";
  let cat = "Other Small Parts";
  if(/batter/.test(t)) cat="Battery";
  else if(/charg|dock connector|dock port/.test(t)) cat="Charging Port";
  else if(/screen|lcd|oled|amoled|display|digitizer|touch/.test(t)) cat="Screen";
  else if(/back glass|rear glass|back cover|battery cover|housing/.test(t)) cat="Back Glass / Housing";
  let brand = "";
  if(/iphone|ipad|apple|macbook|ipod/.test(t)) brand="Apple";
  else if(/samsung|galaxy/.test(t)) brand="Samsung";
  else if(/pixel|google/.test(t)) brand="Google";
  else if(/motorola|moto\b/.test(t)) brand="Motorola";
  else if(/oneplus/.test(t)) brand="OnePlus";
  else if(/\blg\b/.test(t)) brand="LG";
  else if(/playstation|ps5|ps4|ps3/.test(t)) brand="Sony";
  else if(/xbox/.test(t)) brand="Microsoft";
  else if(/nintendo|\bswitch\b/.test(t)) brand="Nintendo";
  // model — supplier names are usually "<part> For <device model> (<quality>)",
  // so prefer the text after "For"; otherwise take the portion before the
  // repair/part keyword. Then drop the trailing "(...)" quality note.
  let model = "";
  const forMatch = s.match(/\bfor\s+(.+)/i);
  if(forMatch){
    model = forMatch[1];
  } else {
    const cut = s.search(/\b(lcd|oled|amoled|screen|display|digitizer|battery|charging|charge\s*port|back\s*glass|rear\s*glass|back\s*cover|housing|assembly|flex|camera|speaker|earpiece|button|frame|adhesive|glass|lens|replacement|compatible)\b/i);
    model = cut>0 ? s.slice(0,cut) : s;
  }
  model = model.replace(/\s*[\(\[].*$/, "").replace(/\s+/g," ").replace(/[\/,;:\-–—]+\s*$/,"").trim();
  if(model.length>60) model = model.slice(0,60).trim();
  return { device, cat, brand, model };

/* =========================================================================
   SECURE PAYMENT — SOHO new-customer card on file (Authorize.Net hosted form)

   Flow: the Cognito intake (embedded above) submits to n8n. n8n releases
   existing customers immediately; NEW customers are held as awaiting_payment.
   Cognito then redirects its iframe to /payment-bridge.html?request=<id>,
   which postMessages the opaque request ID up to this app. The app swaps the
   intake pane for the payment panel, fetches a short-lived Authorize.Net
   hosted-page token from /api/payment-token, and shows Authorize.Net's own
   card form in an iframe. After the form reports success, /api/payment-verify
   confirms with Authorize.Net that a payment profile really exists and only
   then releases the held support request.

   Card numbers are typed straight into Authorize.Net's page — they never
   touch this app, the API functions, n8n, or Cognito. The only card info the
   app ever sees is the masked brand + last 4 that Authorize.Net returns.
   ========================================================================= */
const PAY_SS_KEY = 'cw_intake_pending';
let PAY = null;   // { requestId, stage, customer, card, msg, msgSoft }

function payPersist(){
  try{
    if(PAY && PAY.requestId && PAY.stage!=='done') sessionStorage.setItem(PAY_SS_KEY, PAY.requestId);
    else sessionStorage.removeItem(PAY_SS_KEY);
  }catch(e){}
}
function payWrapEl(){ return document.getElementById('payWrap'); }
function payActive(){ return !!(PAY && PAY.requestId && PAY.stage!=='done'); }

function payAdopt(requestId){
  requestId = String(requestId||'').trim();
  if(!/^[A-Za-z0-9_-]{1,64}$/.test(requestId)) return;
  if(PAY && PAY.requestId===requestId && PAY.stage!=='status') return;   // already tracking
  PAY = { requestId, stage:'status' };
  payPersist();
  if(payWrapEl()){ payRender(); payRefresh(); }
}

async function payFetch(url, opts){
  try{
    const r = await fetch(url, Object.assign({ headers:{ 'Accept':'application/json', 'Content-Type':'application/json' } }, opts||{}));
    return await r.json();
  }catch(e){ return { ok:false, error:'network', detail:String(e&&e.message||e) }; }
}

async function payRefresh(){
  if(!PAY) return;
  const d = await payFetch('/api/support-intake?id='+encodeURIComponent(PAY.requestId));
  if(!PAY) return;
  if(!d || !d.ok || !d.status){
    PAY.stage='error';
    PAY.msg = (d && d.error==='unknown_request')
      ? "This request isn't in the system yet. Wait a moment and press Retry."
      : "Couldn't reach the server. Check the connection and press Retry.";
  } else {
    if(d.customer) PAY.customer = d.customer;
    if(d.phone) PAY.phone = d.phone;
    if(d.address) PAY.address = d.address;
    if(d.status==='awaiting_payment'){ PAY.stage = PAY.stage==='form' ? 'form' : 'ready'; }
    else if(d.status==='payment_secured' || d.status==='released'){
      if(d.cardSummary){ PAY.stage='secured'; PAY.card=d.cardSummary; }
      else PAY.stage='submitted';
    }
    else PAY.stage='submitted';
  }
  payRender();
}

async function payToken(){
  if(!PAY) return;
  PAY.stage='loading'; PAY.msg=''; payRender();
  const d = await payFetch('/api/payment-token', { method:'POST', body:JSON.stringify({ requestId:PAY.requestId }) });
  if(!PAY) return;
  if(d && d.ok && d.token){
    PAY.stage='form'; PAY.form={ token:d.token, action:d.action }; payRender();
  } else if(d && d.error==='not_awaiting'){
    payRefresh();   // state moved on (already secured / released) — re-sync
  } else {
    PAY.stage='ready';
    PAY.msg = d && d.error==='anet_not_configured'
      ? 'Payment system is not configured yet — let the admin know (Authorize.Net keys missing).'
      : "Couldn't open the secure card form. " + (d && d.error ? '('+d.error+') ' : '') + 'Try again in a moment.';
    payRender();
  }
}

async function payVerify(){
  if(!PAY) return;
  PAY.stage='verifying'; PAY.msg=''; payRender();
  const d = await payFetch('/api/payment-verify', { method:'POST', body:JSON.stringify({ requestId:PAY.requestId }) });
  if(!PAY) return;
  if(d && d.ok && d.secured){
    PAY.stage='secured';
    PAY.card = d.cardSummary || [d.brand, d.last4 ? '•••• '+d.last4 : ''].filter(Boolean).join(' ');
    payRender();
  } else if(d && d.ok && !d.secured){
    PAY.stage='ready';
    PAY.msg = "The card wasn't saved yet — open the secure form and try again.";
    payRender();
  } else if(d && d.error==='release_failed'){
    PAY.stage='ready';
    PAY.msgSoft = true;
    const saved = d.cardSummary || [d.brand, d.last4].filter(Boolean).join(' ');
    PAY.msg = 'The card WAS saved securely'+(saved?' ('+saved+')':'')+', but releasing the request failed. Press Verify again — do NOT re-enter the card.';
    payRender();
  } else {
    PAY.stage='ready';
    PAY.msg = "Couldn't confirm the payment method"+(d && d.error ? ' ('+d.error+')' : '')+'. Press Verify to try again.';
    payRender();
  }
}

function payAnetEvent(qstr){
  const params = {};
  String(qstr||'').split('&').forEach(kv=>{ const i=kv.indexOf('='); if(i>0) params[decodeURIComponent(kv.slice(0,i))]=decodeURIComponent(kv.slice(i+1)); });
  const action = params.action||'';
  if(action==='resizeWindow'){
    const fr = document.getElementById('anetFrame');
    const h = parseInt(params.height,10);
    if(fr && h>0) fr.style.height = Math.min(Math.max(h,320),1400)+'px';
  } else if(action==='successfulSave'){
    payVerify();
  } else if(action==='cancel'){
    if(PAY){ PAY.stage='ready'; PAY.msgSoft=true; PAY.msg='No card was saved. Open the secure form again when the customer is ready.'; payRender(); }
  }
}
window.AuthorizeNetIFrame = { onReceiveCommunication: q=>payAnetEvent(String(q||'')) };
window.addEventListener('message', ev=>{
  if(ev.origin !== location.origin) return;
  const d = ev.data || {};
  if(d.type==='cw-intake' && d.requestId) payAdopt(String(d.requestId));
  else if(d.type==='cw-anet' && d.qstr) payAnetEvent(String(d.qstr));
});

// Abandon the current held request (it stays awaiting_payment in n8n as an
// audit record) and re-render the step so a fresh Cognito form loads.
function payStartNew(){
  PAY=null; try{ sessionStorage.removeItem(PAY_SS_KEY); }catch(e){}
  if(state && state.flowId){ renderStep(); } else { goHome(); }
}

// Business check: release without a card, gated by a mandatory note that the
// dispatching team reviews (Autotask billing note + Teams alert) before dispatch.
async function payCheckSubmit(){
  const t=document.getElementById('payCheckNote');
  const note=(t?t.value:'').trim();
  PAY.checkNote=note;
  if(note.length<10){ PAY.msg='Add a short note first (at least 10 characters) — the dispatching team reads this to approve check payment.'; payRender(); return; }
  if(!window.confirm('Release WITHOUT a card on file? Dispatch will hold this request until the dispatching team approves business-check payment.')) return;
  PAY.stage='status'; PAY.msg=''; payRender();
  let d=null;
  try{
    const r=await fetch('/api/payment-bypass',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({requestId:PAY.requestId,note})});
    d=await r.json();
  }catch(e){}
  if(d && d.ok){
    PAY={stage:'checkdone'};
    try{ sessionStorage.removeItem(PAY_SS_KEY); }catch(e){}
    payRender();
  } else {
    PAY.stage='check';
    PAY.msg='Could not submit'+(d&&d.error?' ('+d.error+')':'')+'. Try again.';
    payRender();
  }
}

function payRender(){
  const wrap = payWrapEl(); if(!wrap) return;
  const embed = wrap.parentElement ? wrap.parentElement.querySelector('.embed') : null;
  const fallback = document.getElementById('payFallback');
  const active = payActive();
  if(embed) embed.style.display = active ? 'none' : '';
  if(fallback) fallback.style.display = active ? 'none' : '';
  if(!active){ wrap.innerHTML=''; return; }

  const msg = PAY.msg ? `<div class="pay-msg${PAY.msgSoft?' soft':''}">${esc(PAY.msg)}</div>` : '';
  PAY.msgSoft = false;
  const who = PAY.customer ? `<div class="pay-title">Customer: ${esc(PAY.customer)}</div>` : '';
  const intakeInfo = [PAY.customer, PAY.phone, PAY.address].filter(Boolean).join('  ·  ');
  const infoLine = intakeInfo ? `<div class="pay-msg soft">Billing info from the intake — ${esc(intakeInfo)}</div>` : '';
  let h = '';

  if(PAY.stage==='status' || PAY.stage==='loading' || PAY.stage==='verifying'){
    const line = PAY.stage==='verifying' ? 'Confirming the payment method with Authorize.Net…'
               : PAY.stage==='loading' ? 'Opening the secure card form…'
               : 'Checking this request…';
    h = `<div class="pay-card"><div class="pay-eyebrow">Secure payment method</div>${who}
      <div class="pay-wait"><span class="dotp"></span>${esc(line)}</div></div>`;
  }
  else if(PAY.stage==='ready'){
    h = `<div class="pay-card"><div class="pay-eyebrow">Secure payment method</div>${who}
      <p class="pay-sub">Support request received. A card on file is <b>required</b> before this new-customer request can be released to the team.</p>
      ${msg}
      <p class="pay-sub">The card is entered on Authorize.Net's secure form — card numbers never touch the Call Console, Cognito, or email.</p>
      <div class="pay-actions">
        <button class="btn-primary" id="payAddBtn">${ic('<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>')} Add Card on File</button>
        <button class="btn-ghost" id="payVerifyBtn">Verify</button>
        <button class="btn-ghost" id="payCheckBtn">Business check — request review</button>
        <button class="btn-ghost" id="payNewBtn">Customer declined — start a new request</button>
      </div></div>`;
  }
  else if(PAY.stage==='form'){
    h = `<div class="pay-card"><div class="pay-eyebrow">Secure payment method</div>${who}
      <p class="pay-sub">Read the card details from the caller and enter them below. This form is served by <b>Authorize.Net</b> — the numbers go straight to their vault.</p>
      ${msg}
      ${infoLine}
      <div class="pay-frame"><iframe id="anetFrame" name="anetFrame" title="Authorize.Net secure payment form" allow="payment"></iframe></div>
      <div class="pay-actions"><button class="btn-ghost" id="payCancelBtn">Cancel — back without saving</button></div></div>`;
  }
  else if(PAY.stage==='secured'){
    h = `<div class="pay-card ok"><div class="pay-eyebrow">Secure payment method</div>
      <div class="pay-title"><span class="tick">${ic('<path d="M20 6 9 17l-5-5"/>')}</span>Payment Method Secured</div>
      ${PAY.card ? `<div class="pay-badge">${esc(PAY.card)}</div>` : ''}
      <p class="pay-sub">Request released and ready for dispatch. Billing will charge the stored card from Authorize.Net once the work is completed.</p>
      <div class="pay-actions"><button class="btn-primary" id="payFinishBtn">${ic('<path d="M20 6 9 17l-5-5"/>')} Finish</button></div></div>`;
  }
  else if(PAY.stage==='submitted'){
    h = `<div class="pay-card ok"><div class="pay-eyebrow">Support request</div>
      <div class="pay-title"><span class="tick">${ic('<path d="M20 6 9 17l-5-5"/>')}</span>Request submitted</div>
      <p class="pay-sub">Existing customer — the request went straight through to the normal workflow. Nothing else is needed here.</p>
      <div class="pay-actions"><button class="btn-primary" id="payFinishBtn">${ic('<path d="M20 6 9 17l-5-5"/>')} Finish</button></div></div>`;
  }
  else if(PAY.stage==='check'){
    h = `<div class="pay-card"><div class="pay-eyebrow">Secure payment method</div>${who}
      <p class="pay-sub"><b>Business check — dispatch review required.</b> This releases the request <b>without</b> a card on file. Dispatch will <b>not</b> schedule anyone until the dispatching team confirms this customer qualifies to pay by business check.</p>
      ${msg}
      <p class="pay-sub">Explain why they qualify — established business, who you spoke with, PO/check details:</p>
      <textarea id="payCheckNote" class="pl-q" style="width:100%;min-height:90px;resize:vertical" placeholder="e.g. Office manager at Smith Dental — long-standing business customer, pays by company check on completion. Spoke with Karen.">${esc(PAY.checkNote||'')}</textarea>
      <div class="pay-actions" style="margin-top:12px">
        <button class="btn-primary" id="payCheckSend">Submit for review</button>
        <button class="btn-ghost" id="payCheckCancel">Back</button>
      </div></div>`;
  }
  else if(PAY.stage==='checkdone'){
    h = `<div class="pay-card ok"><div class="pay-eyebrow">Support request</div>
      <div class="pay-title"><span class="tick">${ic('<path d="M20 6 9 17l-5-5"/>')}</span>Released for dispatch review</div>
      <p class="pay-sub">Sent through <b>without a card on file</b>, marked "Business check — pending review." The dispatching team has been alerted in Teams and will confirm eligibility <b>before anyone is dispatched</b>. Your note is on the ticket.</p>
      <div class="pay-actions"><button class="btn-primary" id="payFinishBtn">${ic('<path d="M20 6 9 17l-5-5"/>')} Finish</button></div></div>`;
  }
  else { // error
    h = `<div class="pay-card"><div class="pay-eyebrow">Secure payment method</div>${who}
      ${msg||'<div class="pay-msg">Something went wrong.</div>'}
      <div class="pay-actions"><button class="btn-primary" id="payRetryBtn">Retry</button>
      <button class="btn-ghost" id="payDismissBtn">Back to the form</button></div></div>`;
  }

  wrap.innerHTML = h;
  const on=(id,fn)=>{ const el=document.getElementById(id); if(el) el.onclick=fn; };
  on('payAddBtn', payToken);
  on('payVerifyBtn', payVerify);
  on('payCancelBtn', ()=>{ PAY.stage='ready'; PAY.msgSoft=true; PAY.msg='No card was saved.'; payRender(); });
  on('payRetryBtn', ()=>{ PAY.stage='status'; payRender(); payRefresh(); });
  on('payDismissBtn', payStartNew);
  on('payNewBtn', payStartNew);
  on('payCheckBtn', ()=>{ PAY.stage='check'; payRender(); });
  on('payCheckCancel', ()=>{ const t=document.getElementById('payCheckNote'); if(t) PAY.checkNote=t.value; PAY.stage='ready'; payRender(); });
  on('payCheckSend', payCheckSubmit);
  on('payFinishBtn', ()=>{ PAY={stage:'done'}; PAY=null; try{sessionStorage.removeItem(PAY_SS_KEY);}catch(e){} goHome(); });

  if(PAY.stage==='form' && PAY.form && PAY.form.token){
    // POST the short-lived token into the iframe (Authorize.Net's documented
    // pattern). The token is single-purpose and expires in ~15 minutes.
    const f = document.createElement('form');
    f.method='post'; f.action=PAY.form.action; f.target='anetFrame'; f.style.display='none';
    const inp = document.createElement('input');
    inp.type='hidden'; inp.name='token'; inp.value=PAY.form.token;
    f.appendChild(inp); document.body.appendChild(f);
    f.submit(); setTimeout(()=>{ try{f.remove();}catch(e){} },0);
    PAY.form = null;   // one-shot; a retry fetches a fresh token
  }
  scheduleFit();
}

async function payLoadLatest(){
  const fb = document.getElementById('payFallback');
  if(fb){ fb.textContent = 'Checking for a pending payment request…'; }
  const d = await payFetch('/api/support-intake?latest=1');
  if(d && d.ok && d.requestId){ payAdopt(d.requestId); }
  else if(fb){ fb.textContent = 'No pending payment request found — tap to check again'; }
}

function wireSupportIntake(){
  const pane = stage.querySelector('.pane-choices'); if(!pane) return;
  if(!document.getElementById('payWrap')){
    const wrap = document.createElement('div'); wrap.id='payWrap';
    pane.insertBefore(wrap, pane.firstChild);

function startFlow(id){ state={flowId:id,idx:0,actions:new Set()}; history=[]; renderStep(); }

function renderStep(){
  const flow=FLOWS[state.flowId], step=flow.steps[state.idx], total=flow.steps.length;
  let flowbar=`<div class="flowbar"><button class="back" id="backBtn">${ic('<path d="M15 18l-6-6 6-6"/>')} Back</button><span class="flowtag"><span class="dot" style="background:${flow.color}"></span>${esc(flow.label)}</span>`;
  if(total>1) flowbar+=`<span class="steptrack">Step ${state.idx+1} / ${total}</span>`;
  flowbar+=`</div>`;

  // LEFT = what to say/read  (script text is admin-overridable by flow+step id)
  const sk = 'flow.'+state.flowId+'.'+step.id;
  let left='';
  if(step.say) left+=sayBlock(t(sk+'.say', step.say));
  if(step.note) left+=noteBlock(t(sk+'.note', step.note),step.warn);
  if(step.close) left+=apptCtaLeft();

  // RIGHT = what to do
  let right='';
  if(step.embed) right+=embedBlock(step.embed);
  if(step.sayAfterEmbed) right+=sayBlock(t(sk+'.sayAfterEmbed', step.sayAfterEmbed),"Once submitted, say");
  if(step.extras) right+=extrasBlock(step.extras);
  if(step.sections){ right+=`<div class="sec-lbl">Pricing &amp; coverage</div>`+step.sections.map(sectionBlock).join(''); }
  if(step.choices) right+=choicesBlock(step.choices);
  let full='';
  if(step.close){
    if(step.noAsk){ right+=computerCloseCards(); full=computerObjections(); }
    else right+=closingBlock(false);
  }
  if(step.checklist) right+=checklistBlock(step.checklist);

  let footer='';
  if(step.end) footer=`<button class="btn-ghost" id="prevBtn">${ic('<path d="M15 18l-6-6 6-6"/>')} Back</button><button class="btn-primary push" id="finishBtn">${ic('<path d="M20 6 9 17l-5-5"/>')} Finish call</button>`;
  else if(step.choices) footer=`<button class="btn-ghost" id="prevBtn">Back</button><span class="push hint">Pick an option to continue</span>`;
  else footer=`<button class="btn-ghost" id="prevBtn">Back</button><button class="btn-primary push" id="nextBtn">Next ${ic('<path d="M9 18l6-6-6-6"/>')}</button>`;

  stage.innerHTML=screen({flowbar,accent:flow.color,accentSoft:flow.tintSoft,title:esc(step.title),sub:step.sub?esc(step.sub):'',left,right,full,footer});
  wireStep(step);
  if(step.payment) wireSupportIntake();
}

function wireStep(step){
  document.getElementById('backBtn').onclick=()=>{ if(history.length){state.idx=history.pop();renderStep();} else renderHome(); };
  const prev=document.getElementById('prevBtn'); if(prev) prev.onclick=()=>{ if(history.length){state.idx=history.pop();renderStep();} else renderHome(); };
  const next=document.getElementById('nextBtn'); if(next) next.onclick=()=>goNext(step.next);
  const finish=document.getElementById('finishBtn'); if(finish) finish.onclick=goHome;
  wireApptButtons(()=>renderStep(), APPT_LINKS.computer);

  stage.querySelectorAll('.choice').forEach(b=>b.onclick=()=>goNext(step.choices[+b.dataset.choice].next));

  // accordions
  stage.querySelectorAll('.acc-head').forEach(hd=>hd.onclick=()=>hd.parentElement.classList.toggle('open'));

  // calculators
  stage.querySelectorAll('.calc').forEach(setupCalc);

  // closing reveals
  const closing=stage.querySelector('.closing');
  if(closing){
    closing.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{
      closing.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('on',x===b));
      closing.querySelectorAll('[data-rev]').forEach(r=>r.classList.toggle('show',r.dataset.rev===b.dataset.r));
    });
    // objection buttons: toggle off if re-tapped, so nothing is forced open
    closing.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{
      const was=b.classList.contains('on');
      closing.querySelectorAll('[data-o]').forEach(x=>x.classList.remove('on'));
      closing.querySelectorAll('[data-orev]').forEach(r=>r.classList.remove('show'));
      if(!was){ b.classList.add('on'); const t=closing.querySelector(`[data-orev="${b.dataset.o}"]`); if(t) t.classList.add('show'); }
    });
  }

  // checklist
  stage.querySelectorAll('.act').forEach(b=>b.onclick=()=>{
    const a=b.dataset.act;
    if(state.actions.has(a)) state.actions.delete(a); else state.actions.add(a);
    b.classList.toggle('on');
  });
}

function setupCalc(el){
  const device=el.dataset.device, fixed=el.dataset.category;
  const cost=el.querySelector('.c-cost'), labor=el.querySelector('.c-labor'), catSel=el.querySelector('.c-cat');
  const cust=el.querySelector('.c-cust'), mraWrap=el.querySelector('.c-mra-wrap'), mra=el.querySelector('.c-mra');
  const scope=el.closest('.acc-body')||stage;
  const sayPrice=scope.querySelector('.say-price'), cov=scope.querySelector('.c-cov');
  function currentCat(){ return catSel?catSel.value:fixed; }
  function run(){
    const cat=currentCat();
    if(cov&&catSel) cov.textContent=coverageFor(device,cat);
    const r=priceCalc(device,cat,cost?cost.value:'',labor.value);
    if(!r){ cust.textContent='$—'; if(sayPrice)sayPrice.textContent='$xxx.xx'; if(mraWrap)mraWrap.style.display='none'; return; }
    cust.textContent=money(r.customer);
    if(sayPrice) sayPrice.textContent=money(r.customer);
    if(mraWrap){ if(r.mra!=null){ mraWrap.style.display=''; mra.textContent=money(r.mra);} else mraWrap.style.display='none'; }
  }
  [cost,labor,catSel].forEach(i=>{ if(i){ i.addEventListener('input',run); i.addEventListener('change',run);} });
  run();
}

function goNext(id){
  const flow=FLOWS[state.flowId];
  history.push(state.idx);
  const i=id?flow.steps.findIndex(s=>s.id===id):-1;
  state.idx=i>=0?i:Math.min(state.idx+1,flow.steps.length-1);
  renderStep();
}

/* =========================================================================

function rerenderCurrent(){
  if(document.getElementById('cwAdmin')) return;
  if(!state) renderHome();

  else renderStep();
}

function openAdmin(){
  primeDefaults();
  let el = document.getElementById('cwAdmin');
  if(!el){ el = document.createElement('div'); el.id='cwAdmin'; document.body.appendChild(el); }
  el.innerHTML = ADMIN_CSS + `<div class="cwa-wrap"><div class="cwa-card">
    <div class="cwa-h">Admin — enter code</div>
    <input type="password" id="cwaPin" class="cwa-pin" placeholder="Code" autocomplete="off" inputmode="numeric">
    <div class="cwa-err" id="cwaGateErr"></div>
    <div class="cwa-row"><button class="cwa-btn ghost" id="cwaCancel">Cancel</button><button class="cwa-btn" id="cwaUnlock">Unlock</button></div>
  </div></div>`;
  el.querySelector('#cwaCancel').onclick=closeAdmin;
  const go=()=>adminUnlock(el);
  el.querySelector('#cwaUnlock').onclick=go;
  const pin=el.querySelector('#cwaPin'); pin.addEventListener('keydown',e=>{ if(e.key==='Enter') go(); }); setTimeout(()=>pin.focus(),50);
}
function closeAdmin(){
  const el=document.getElementById('cwAdmin'); if(el) el.remove();
  if(location.hash==='#admin') history.replaceState(null,'',location.pathname+location.search);
  rerenderCurrent();
}
async function adminUnlock(el){
  const pin = el.querySelector('#cwaPin').value;
  const errEl = el.querySelector('#cwaGateErr'); errEl.textContent='Checking…';
  try{
    const r = await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin, config: ADMIN_CFG})});
    const d = await r.json();
    if(d && d.ok) renderAdminEditor(el, pin);
    else errEl.textContent = (d && d.error==='invalid_pin') ? 'Incorrect code.' : 'Could not verify — try again.';
  }catch(e){ errEl.textContent='Network error.'; }
}
function renderAdminEditor(el, pin){
  const groups = ADMIN_SCHEMA.map(g=>{
    const fields = g.fields.map(f=>{
      const cur = ov(f.k)!=null ? ov(f.k) : (DEF[f.k]||'');
      const rows = Math.min(9, Math.max(2, Math.ceil((String(cur).length||20)/58)));
      return `<div class="cwa-field"><label>${esc(f.l)}<button class="cwa-reset" data-reset="${esc(f.k)}">reset</button></label>`
        + `<textarea data-k="${esc(f.k)}" rows="${rows}">${esc(cur)}</textarea></div>`;
    }).join('');
    return `<div class="cwa-group"><div class="cwa-gh">${esc(g.title)}</div>${g.note?`<div class="cwa-gnote">${esc(g.note)}</div>`:''}${fields}</div>`;
  }).join('');
  el.innerHTML = ADMIN_CSS + `<div class="cwa-wrap"><div class="cwa-panel">
    <div class="cwa-top"><div class="cwa-title">Edit call scripts</div><button class="cwa-btn ghost" id="cwaClose">Close</button></div>
    <div class="cwa-body">${groups}</div>
    <div class="cwa-save"><span class="cwa-status" id="cwaStatus"></span><button class="cwa-btn" id="cwaSave">Save changes</button></div>
  </div></div>`;
  el.querySelector('#cwaClose').onclick=closeAdmin;
  el.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{ const ta=el.querySelector('textarea[data-k="'+b.dataset.reset+'"]'); if(ta) ta.value = DEF[b.dataset.reset]||''; });
  el.querySelector('#cwaSave').onclick=()=>saveAdmin(el, pin);
}
async function saveAdmin(el, pin){
  const status = el.querySelector('#cwaStatus'); status.textContent='Saving…'; status.className='cwa-status';
  const config = {};
  el.querySelectorAll('textarea[data-k]').forEach(ta=>{
    const k=ta.dataset.k, v=ta.value;
    if(v !== (DEF[k]||'')) deepSet(config, k, v);
  });
  try{
    const r = await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin, config})});
    const d = await r.json();
    if(d && d.ok){ ADMIN_CFG = config; status.textContent='Saved — scripts updated on every device.'; status.className='cwa-status ok'; }
    else { status.textContent = (d && d.error==='invalid_pin') ? 'Incorrect code — not saved.' : 'Save failed — try again.'; status.className='cwa-status err'; }
  }catch(e){ status.textContent='Network error — not saved.'; status.className='cwa-status err'; }
}
